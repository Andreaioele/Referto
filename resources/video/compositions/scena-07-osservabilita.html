      // SINCRONIA-INIZIO (generato da voce/sincronizza.py: non modificare a mano)
      // Tempi della scena: [tempo sulla voce di riferimento, tempo sulla traccia].
      const SINCRONIA = [[0.0, 0.0], [0.9, 0.9], [2.162, 2.33], [2.971, 3.03], [3.793, 3.81], [4.674, 4.76], [6.317, 7.18], [7.16, 8.18], [8.957, 10.13], [10.064, 11.57], [10.969, 12.35], [12.469, 14.23], [13.552, 16.06]];
      // Ricrea ogni tween sui tempi della traccia (inizio spostato, durata adattata).
      // Non si cambiano startTime() e timeScale() dei tween esistenti: GSAP li
      // disegnerebbe subito e i fromTo con immediateRender: false applicherebbero i
      // valori di partenza fuori tempo. Alla fine la timeline va alla fine e torna
      // all'inizio: così ogni .to() registra la partenza giusta una volta per tutte e
      // l'anteprima o il render possono saltare in qualsiasi punto.
      function riallinea(tl) {
        const T = (t) => {
          if (t <= SINCRONIA[0][0]) return t - SINCRONIA[0][0] + SINCRONIA[0][1];
          for (let i = 1; i < SINCRONIA.length; i++) {
            if (t <= SINCRONIA[i][0]) {
              const [a0, b0] = SINCRONIA[i - 1];
              const [a1, b1] = SINCRONIA[i];
              return b0 + ((t - a0) * (b1 - b0)) / (a1 - a0);
            }
          }
          const [a, b] = SINCRONIA[SINCRONIA.length - 1];
          return b + (t - a);
        };
        const figli = tl.getChildren(false, true, false).map((f) => ({
          f,
          inizio: f.startTime(),
          durata: f.totalDuration(),
          vars: f.vars,
          bersagli: f.targets(),
        }));
        for (const { f } of figli) f.kill();
        for (const { inizio, durata, vars, bersagli } of figli) {
          const nuovoInizio = T(inizio);
          const fattore = durata > 0 ? Math.max(0.01, T(inizio + durata) - nuovoInizio) / durata : 1;
          const nuovi = { ...vars, immediateRender: false };
          delete nuovi.parent;
          delete nuovi.delay;
          if (typeof vars.duration === "number") nuovi.duration = vars.duration * fattore;
          if (typeof vars.stagger === "number") nuovi.stagger = vars.stagger * fattore;
          if (typeof vars.repeatDelay === "number") nuovi.repeatDelay = vars.repeatDelay * fattore;
          tl.to(bersagli, nuovi, nuovoInizio);
        }
        tl.progress(1).progress(0);
      }
      // SINCRONIA-FINE
        // Tempi locali: voce 07 a +0,8 s.
        const tl = gsap.timeline({ paused: true });
        const cifra = (sel, t) => tl.fromTo(sel, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "back.out(1.8)" }, t);

        // Dissolvenza di 1 s sopra lo zoom su AMD ormai fermo: più breve sembrava un taglio.
        tl.fromTo("#s7-fondo", { opacity: 0 }, { opacity: 1, duration: 1.0, ease: "power1.inOut" }, 0);
        tl.fromTo("#s7-occhiello", { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.6);

        // «And every run leaves a trace:» la trace si apre e le barre si disegnano.
        // Entra mentre il diagramma della scena 6 si dissolve sotto: nessun vuoto tra le due.

        ["#s7-b1", "#s7-b2", "#s7-b3", "#s7-b4", "#s7-b5"].forEach((barra, i) => {
          tl.fromTo(barra, { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.out" }, 2.0 + i * 0.18);
        });
        // «timings, tokens,»
        cifra("#s7-c1", 2.9);
        cifra("#s7-c2", 3.15);
        cifra("#s7-c3", 3.75);
        // «the tools the agent called,»
        tl.to(["#s7-t1", "#s7-t2"], { color: "#ffffff", duration: 0.3 }, 4.55);
        tl.fromTo(["#s7-b3", "#s7-b4"], { boxShadow: "0 0 0 0 rgba(224, 182, 79, 0.6)" }, { boxShadow: "0 0 0 10px rgba(224, 182, 79, 0)", duration: 0.7, ease: "power1.out" }, 4.6);
        cifra("#s7-c4", 4.9);
        // «and the outcome.»
        cifra("#s7-esito", 6.0);
        // «Never the text of the report.»
        tl.fromTo("#s7-privacy", { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.6)" }, 7.1);

        // «We use these traces to measure every version of Referto, and to make the next one better.»

        tl.fromTo("#s7-ciclo", { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 9.0);
        tl.to("#s7-p1", { opacity: 1, duration: 0.3 }, 9.3);
        tl.to("#s7-cerchio", { strokeDashoffset: 0, duration: 3.6, ease: "none" }, 9.4);
        tl.to("#s7-p2", { opacity: 1, duration: 0.3 }, 9.95);
        tl.to("#s7-p3", { opacity: 1, duration: 0.3 }, 12.1);
        tl.fromTo("#s7-versione-numero", { scale: 0.7, opacity: 0.4 }, { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(2)" }, 12.9);

        riallinea(tl);
        window.__timelines["scena-07-osservabilita"] = tl;
