                  <div data-hf-id="hf-2x0v" class="lettore-vista"><p class="lettore-citata" id="s5-citata"><span class="pastiglia pastiglia-referto">Citata nella risposta</span>Sezione 1 · Cos’è TRIATEC e a cosa serve</p><div data-hf-id="hf-0inn" class="pagina-pdf"><img data-hf-id="hf-zn7v" id="s5-pdf" src="assets/ui/foglietto-triatec-p1.png" alt="Pagina 1 del foglietto illustrativo del Triatec (AIFA)" /></div></div>

                    <div data-hf-id="hf-ke7u" class="lettore-domande-testa"><span data-hf-id="hf-l4v3" class="referto-marchio piccolo-marchio">R</span><div data-hf-id="hf-y7yw"><strong data-hf-id="hf-rs92">Domande su questo foglietto</strong><span data-hf-id="hf-if6c">Rispondo solo con ciò che c'è scritto</span></div></div>
                    <div data-hf-id="hf-ijgc" class="lettore-domande-corpo" id="s5-corpo-domande">
                      <div data-hf-id="hf-8665" class="referto-box" id="s5-intro"><p data-hf-id="hf-zu9i">Fammi una domanda su Triatec. Ti dico cosa dice il foglietto e in quale sezione trovarlo. Non do consigli: per quelli c'è il medico o il farmacista.</p></div>
                      <div data-hf-id="hf-7qpf" class="referto-scambio" id="s5-scambio"><p data-hf-id="hf-6me0" class="referto-domanda">A cosa serve?</p><section data-hf-id="hf-1wzt" class="referto-box"><p data-hf-id="hf-hz75" class="referto-attesa" id="s5-attesa"><span data-hf-id="hf-gx8m" class="rotella" id="s5-rotella"></span>Cerco la risposta nel foglietto… può servire mezzo minuto.</p><p class="s5-scrive" id="s5-risposta">Il foglietto dice che Triatec contiene ramipril, un ACE inibitore. Può essere usato per trattare la pressione alta del sangue (ipertensione), per ridurre il rischio di un attacco cardiaco o di un ictus, per ridurre il rischio o ritardare il peggioramento di problemi renali e per l'insufficienza cardiaca.</p><button type="button" class="referto-fonte" id="s5-fonte"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><path d="M14 3v6h6"></path></svg>Sezione 1 · Cos’è TRIATEC e a cosa serve</button></section></div>

        <div data-hf-id="hf-gqd1" class="s5-sottopancia s5-a-destra" id="s5-sp3"><span data-hf-id="hf-78nm" class="s5-r">R</span><div data-hf-id="hf-xfcu"><strong data-hf-id="hf-pitz">Cardiology clinics</strong><span data-hf-id="hf-in2g">The nearest to home, from the report’s specialty</span></div></div>
        <div data-hf-id="hf-npgq" class="s5-sottopancia" id="s5-sp4"><span data-hf-id="hf-7myn" class="s5-r">R</span><div data-hf-id="hf-w8fr"><strong data-hf-id="hf-b6u0">On the map</strong><span data-hf-id="hf-tkkz">Data © OpenStreetMap contributors · map by OpenFreeMap</span></div></div>

      <script>
      // SINCRONIA-INIZIO (generato da voce/sincronizza.py: non modificare a mano)
      // Tempi della scena: [tempo sulla voce di riferimento, tempo sulla traccia].
      const SINCRONIA = [[0.0, 0.0], [1.103, 0.9], [3.297, 3.43], [4.87, 4.42], [6.08, 5.93], [7.21, 6.61], [8.699, 10.03], [9.045, 10.72], [10.694, 12.93], [12.29, 14.79], [13.753, 21.86], [15.761, 23.61], [17.596, 26.14], [18.819, 26.85], [21.306, 32.03]];
      // Ricrea ogni tween sui tempi della traccia (inizio spostato, durata adattata).
      // Non si cambiano startTime() e timeScale() dei tween esistenti: GSAP li
      // disegnerebbe subito e i fromTo con immediateRender: false applicherebbero i
      // valori di partenza fuori tempo. Alla fine la timeline va alla fine e torna
      // all'inizio: così ogni .to() registra la partenza giusta una volta per tutte e
      // l'anteprima o il render possono saltare in qualsiasi punto.
      function riallinea(tl) {
        const T = (t) => {
          if (t <= SINCRONIA[0][0]) return t - SINCRONIA[0][0] + SINCRONIA[0][1];
          for (let i = 1; i < SINCRONIA.length; i++) {
            if (t <= SINCRONIA[i][0]) {
              const [a0, b0] = SINCRONIA[i - 1];
              const [a1, b1] = SINCRONIA[i];
              return b0 + ((t - a0) * (b1 - b0)) / (a1 - a0);
            }
          }
          const [a, b] = SINCRONIA[SINCRONIA.length - 1];
          return b + (t - a);
        };
        const figli = tl.getChildren(false, true, false).map((f) => ({
          f,
          inizio: f.startTime(),
          durata: f.totalDuration(),
          vars: f.vars,
          bersagli: f.targets(),
        }));
        for (const { f } of figli) f.kill();
        for (const { inizio, durata, vars, bersagli } of figli) {
          const nuovoInizio = T(inizio);
          const fattore = durata > 0 ? Math.max(0.01, T(inizio + durata) - nuovoInizio) / durata : 1;
          const nuovi = { ...vars, immediateRender: false };
          delete nuovi.parent;
          delete nuovi.delay;
          if (typeof vars.duration === "number") nuovi.duration = vars.duration * fattore;
          if (typeof vars.stagger === "number") nuovi.stagger = vars.stagger * fattore;
          if (typeof vars.repeatDelay === "number") nuovi.repeatDelay = vars.repeatDelay * fattore;
          tl.to(bersagli, nuovi, nuovoInizio);
        }
        tl.progress(1).progress(0);
      }
      // SINCRONIA-FINE
        // Tempi locali: 0 = 74,1 s del video. Voce 05 a +1,0 s.
        const radice = document.getElementById("s5-fondo").parentElement;

        // La risposta del foglietto si scrive parola per parola.
        const risposta = document.getElementById("s5-risposta");
        risposta.innerHTML = risposta.textContent
          .split(" ")
          .map((parola) => `<span class="s5-parola" data-layout-allow-occlusion>${parola}</span>`)
          .join(" ");

        // Il gettone «ramipril» parte dalla parola del referto e arriva sul nome della
        // scheda AIFA. Le posizioni si misurano qui, senza trasformazioni (offsetTop),
        // mostrando per un attimo gli antenati nascosti: con la scena nascosta
        // (display: none) varrebbero zero.
        const posizione = (el) => {
          let x = 0;
          let y = 0;
          for (let nodo = el; nodo && nodo !== radice; nodo = nodo.offsetParent) {
            x += nodo.offsetLeft;
            y += nodo.offsetTop;
          }
          return { x: x + el.offsetWidth / 2, y: y + el.offsetHeight / 2 };
        };
        const nascosti = [];
        for (let nodo = radice; nodo && nodo !== document.documentElement; nodo = nodo.parentElement) {
          if (getComputedStyle(nodo).display === "none") {
            nascosti.push([nodo, nodo.style.display]);
            nodo.style.display = "block";
          }
        }
        // Chat del foglietto: dopo la domanda i suggerimenti si chiudono (come nell'app
        // dopo l'invio) e il pannello scorre fino in fondo alla risposta. Si misura con
        // i suggerimenti già chiusi e la risposta già scritta.
        const corpoDomande = document.getElementById("s5-corpo-domande");
        const suggerimenti = document.getElementById("s5-suggerimenti");
        const attesa = document.getElementById("s5-attesa");
        const displayAttesa = attesa.style.display;
        suggerimenti.style.display = "none";
        attesa.style.display = "none";
        const altoCorpo = posizione(corpoDomande).y - corpoDomande.offsetHeight / 2;
        const finestraDomande = corpoDomande.clientHeight - 32;
        const fondoDi = (el) => posizione(el).y + el.offsetHeight / 2 - altoCorpo - 16;
        const paroleRisposta = [...document.querySelectorAll("#s5-risposta .s5-parola")].map(fondoDi);
        const fondoFonte = fondoDi(document.getElementById("s5-fonte"));
        suggerimenti.style.display = "";
        attesa.style.display = displayAttesa;
        const parolaReferto = posizione(document.getElementById("s5-farmaco"));
        const nomeScheda = posizione(document.getElementById("s5-aifa-nome"));
        for (const [nodo, display] of nascosti) nodo.style.display = display;
        // La scheda AIFA finisce spostata di 420 px a destra (vedi sotto).
        const arrivo = { x: nomeScheda.x + 420, y: nomeScheda.y };

        const tl = gsap.timeline({ paused: true });

        // Punto dello schermo (1440×900) → camera; inquadratura con scala data.
        const inquadra = (x, y, versoX, versoY, scala) => ({
          x: versoX - (240 + x) * scala,
          y: versoY - (112 + y) * scala,
          scale: scala,
        });
        const sottopancia = (sel, da, a) => {
          tl.fromTo(sel, { opacity: 0, y: -24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, da);
          tl.to(sel, { opacity: 0, y: -12, duration: 0.35, ease: "power2.in" }, a);
        };

        tl.fromTo("#s5-fondo", { opacity: 0 }, { opacity: 1, duration: 0.7, ease: "power1.out" }, 0);

        // «Nel referto c'è un farmaco: il ramipril.»
        tl.fromTo("#s5-medico", { opacity: 0, y: 50, scale: 0.95 }, { opacity: 1, y: 0, scale: 1, duration: 0.8, ease: "power3.out" }, 0.5);
        tl.to("#s5-farmaco", { backgroundColor: "rgba(185, 220, 205, 1)", duration: 0.4 }, 3.25);
        sottopancia("#s5-sp1", 1.2, 8.2);

        // «Referto lo trova nel prontuario ufficiale dell'AIFA»: il nome esce dal referto,
        // vola con un arco fino alla scheda e si posa sul suo titolo.
        tl.fromTo(
          "#s5-gettone",
          { opacity: 0, x: parolaReferto.x, y: parolaReferto.y, xPercent: -50, yPercent: -50, scale: 0.6 },
          { opacity: 1, scale: 1.12, duration: 0.3, ease: "back.out(2)" },
          4.6,
        );
        // fromTo con valori di partenza espliciti: con un salto (anteprima o render a pezzi)
        // un .to() leggerebbe valori sbagliati e la nota sparirebbe per un attimo.
        tl.fromTo("#s5-medico", { x: 0, scale: 1, opacity: 1 }, { x: -480, scale: 0.78, opacity: 0.55, duration: 0.9, ease: "power3.inOut", immediateRender: false }, 4.8);
        tl.fromTo("#s5-aifa", { opacity: 0, x: 900 }, { opacity: 1, x: 420, duration: 0.9, ease: "power3.out" }, 5.0);
        tl.to("#s5-gettone", { x: arrivo.x, duration: 1.0, ease: "power2.inOut" }, 4.95);
        tl.to("#s5-gettone", {
          keyframes: { y: [parolaReferto.y, Math.min(parolaReferto.y, arrivo.y) - 140, arrivo.y], easeEach: "sine.inOut" },
          duration: 1.0,
        }, 4.95);
        tl.to("#s5-gettone", { scale: 1, duration: 0.3, ease: "power2.out" }, 5.65);
        tl.to("#s5-gettone", { opacity: 0, duration: 0.25, ease: "power1.in" }, 6.0);
        tl.to("#s5-aifa-nome", { backgroundColor: "rgba(185, 220, 205, 1)", duration: 0.2 }, 5.95);
        tl.to("#s5-aifa-nome", { backgroundColor: "rgba(185, 220, 205, 0)", duration: 0.8, ease: "power1.inOut" }, 6.6);
        tl.fromTo("#s5-trovato", { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(2)" }, 7.0);

        // «…e apre il foglietto illustrativo»: entra la finestra con il lettore vero.
        tl.fromTo("#s5-medico", { opacity: 0.55, y: 0 }, { opacity: 0, y: -40, duration: 0.5, ease: "power2.in", immediateRender: false }, 8.1);
        tl.fromTo("#s5-aifa", { opacity: 1, y: 0 }, { opacity: 0, y: -40, duration: 0.5, ease: "power2.in", immediateRender: false }, 8.1);
        tl.fromTo("#s5-finestra", { opacity: 0, y: 80, scale: 0.95 }, { opacity: 1, y: 0, scale: 1, duration: 0.9, ease: "power3.out" }, 8.35);
        tl.fromTo("#s5-pdf", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 8.9);

        // «…dove Giovanna può fare le sue domande»: la camera va sulle domande.
        tl.fromTo("#s5-camera", { x: 0, y: 0, scale: 1 }, { ...inquadra(1240, 450, 1300, 540, 1.15), duration: 1.3, ease: "power3.inOut" }, 10.5);
        // «…like what it is for.»: la domanda, poi la risposta dal foglietto con la sua sezione.
        tl.to("#s5-chip", { scale: 0.92, backgroundColor: "#d4ebe1", duration: 0.06 }, 12.33);
        tl.to("#s5-chip", { scale: 1, duration: 0.1, ease: "back.out(2)" }, 12.39);
        tl.fromTo("#s5-scambio", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.12, ease: "power2.out" }, 12.42);
        tl.fromTo("#s5-rotella", { rotation: 0 }, { rotation: 360, duration: 0.3, ease: "none" }, 12.44);
        // «The answer comes straight from the leaflet, with the section where to find it.»
        tl.to("#s5-attesa", { opacity: 0, duration: 0.05 }, 12.72);
        tl.set("#s5-attesa", { display: "none" }, 12.77);
        tl.set("#s5-suggerimenti", { display: "none" }, 12.42);
        tl.fromTo("#s5-risposta .s5-parola", { opacity: 0 }, { opacity: 1, duration: 0.03, ease: "none", stagger: 0.32 / 46 }, 12.77);
        // Il pannello segue la risposta mentre si scrive, poi mostra la sezione citata.
        let scorsoDomande = 0;
        const scendiDomande = (fondo, t, durata, ease) => {
          const a = Math.max(0, fondo + 12 - finestraDomande);
          if (a <= scorsoDomande + 1) return;
          tl.fromTo(["#s5-intro", "#s5-scambio"], { y: -scorsoDomande }, { y: -a, duration: durata, ease, immediateRender: false }, t);
          scorsoDomande = a;
        };
        const nParole = paroleRisposta.length;
        for (let i = 3; i < nParole; i += 4) {
          scendiDomande(paroleRisposta[i], 12.77 + (0.32 * i) / nParole, (0.32 * 4) / nParole, "none");
        }
        scendiDomande(fondoFonte, 13.13, 0.06, "power2.out");
        tl.fromTo("#s5-fonte", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.08 }, 13.15);
        tl.to("#s5-fonte", { boxShadow: "0 0 0 6px rgba(23, 107, 88, 0.18)", scale: 1.05, duration: 0.08, ease: "power2.out" }, 13.24);
        tl.to("#s5-fonte", { scale: 1, duration: 0.06 }, 13.32);
        tl.fromTo("#s5-sezione-1", { boxShadow: "0 0 0 0 rgba(23, 107, 88, 0.45)" }, { boxShadow: "0 0 0 6px rgba(23, 107, 88, 0)", duration: 0.12, ease: "power1.out" }, 13.24);
        tl.fromTo("#s5-citata", { opacity: 0, y: -8 }, { opacity: 1, y: 0, duration: 0.08 }, 13.28);

        // «Il medico chiede una nuova visita cardiologica?»: torna il portale, con le strutture.
        tl.to("#s5-lettore", { opacity: 0, duration: 0.2, ease: "power1.inOut" }, 13.66);
        tl.to("#s5-camera", { ...inquadra(850, 520, 960, 560, 1.22), duration: 1.4, ease: "power3.inOut" }, 13.7);
        tl.fromTo("#s5-risultato", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 14.4);
        tl.fromTo(
          ["#s5-struttura-1", "#s5-struttura-2", "#s5-struttura-3"],
          { opacity: 0, x: 30 },
          { opacity: 1, x: 0, duration: 0.45, ease: "power2.out", stagger: 0.2 },
          15.0,
        );
        // «Ecco le strutture di cardiologia più vicine»: la più vicina in evidenza.
        tl.to("#s5-struttura-1", { borderColor: "#176b58", boxShadow: "0 0 0 5px rgba(23, 107, 88, 0.16)", duration: 0.4 }, 17.6);
        sottopancia("#s5-sp3", 14.0, 19.55);

        // «…sulla mappa»: il pannello della mappa della struttura più vicina entra
        // da destra, come nel portale; la camera lo segue e lo ingrandisce.
        tl.to("#s5-apri-mappa", { scale: 0.88, duration: 0.12 }, 19.6);
        tl.to("#s5-apri-mappa", { scale: 1, duration: 0.22, ease: "back.out(2)" }, 19.72);
        // Si scurisce solo il velo: il pannello entra già pieno, scorrendo.
        tl.set("#s5-velo", { opacity: 1 }, 19.9);
        tl.fromTo("#s5-velo", { backgroundColor: "rgba(27, 36, 51, 0)" }, { backgroundColor: "rgba(27, 36, 51, 0.32)", duration: 0.35, ease: "power1.out" }, 19.9);
        tl.fromTo("#s5-finestra-mappa", { x: 520 }, { x: 0, duration: 0.6, ease: "expo.out" }, 19.9);
        tl.to("#s5-camera", { ...inquadra(1180, 420, 1535, 515, 1.25), duration: 1.0, ease: "power3.inOut" }, 19.9);
        tl.fromTo("#s5-segnaposto", { opacity: 0, y: -60 }, { opacity: 1, y: 0, duration: 0.6, ease: "bounce.out" }, 20.85);
        sottopancia("#s5-sp4", 20.6, 22.4);
        // «…on a map.» e la pausa che segue: la mappa resta e si avvicina alla
        // struttura, il segnaposto pulsa, poi si accendono distanza, indirizzo e orari.
        tl.fromTo("#s5-mappa-img", { scale: 1 }, { scale: 1.15, transformOrigin: "239px 279px", duration: 1.5, ease: "sine.inOut" }, 20.05);
        // L'anello parte da opacità 0: un fromTo che parte visibile lo lascerebbe acceso prima del suo tempo.
        tl.fromTo("#s5-anello-pin", { opacity: 0, scale: 0.4 }, { opacity: 0.85, duration: 0.01 }, 20.94);
        tl.to("#s5-anello-pin", { opacity: 0, scale: 2.2, duration: 0.6, ease: "power2.out", repeat: 1 }, 20.95);
        tl.fromTo("#s5-mappa-descrizione", { backgroundColor: "rgba(185, 220, 205, 0)" }, { backgroundColor: "rgba(185, 220, 205, 1)", duration: 0.3 }, 21.0);
        tl.fromTo("#s5-mappa-dati", { borderColor: "#dde3ea", boxShadow: "0 0 0 0 rgba(23, 107, 88, 0)" }, { borderColor: "#176b58", boxShadow: "0 0 0 5px rgba(23, 107, 88, 0.16)", duration: 0.4 }, 21.2);

        riallinea(tl);
        window.__timelines["scena-05-integrazioni"] = tl;
      </script>
    </template>
  </body>
</html>
