      <script>
      // SINCRONIA-INIZIO (generato da voce/sincronizza.py: non modificare a mano)
      // Tempi della scena: [tempo sulla voce di riferimento, tempo sulla traccia].
      const SINCRONIA = [[0.0, 0.0], [0.9, 0.4], [1.626, 1.36], [2.29, 2.08], [4.088, 3.68], [7.326, 7.7], [8.886, 9.19], [12.076, 12.84], [13.279, 14.56], [15.267, 16.64], [16.529, 18.14], [17.54, 19.64], [21.79, 23.88], [24.969, 27.9], [27.707, 30.51], [29.052, 31.73], [30.981, 34.44], [33.755, 37.46], [36.612, 40.42]];
      // Ricrea ogni tween sui tempi della traccia (inizio spostato, durata adattata).
      // Non si cambiano startTime() e timeScale() dei tween esistenti: GSAP li
      // disegnerebbe subito e i fromTo con immediateRender: false applicherebbero i
      // valori di partenza fuori tempo. Alla fine la timeline va alla fine e torna
      // all'inizio: così ogni .to() registra la partenza giusta una volta per tutte e
      // l'anteprima o il render possono saltare in qualsiasi punto.
      function riallinea(tl) {
        const T = (t) => {
          if (t <= SINCRONIA[0][0]) return t - SINCRONIA[0][0] + SINCRONIA[0][1];
          for (let i = 1; i < SINCRONIA.length; i++) {
            if (t <= SINCRONIA[i][0]) {
              const [a0, b0] = SINCRONIA[i - 1];
              const [a1, b1] = SINCRONIA[i];
              return b0 + ((t - a0) * (b1 - b0)) / (a1 - a0);
            }
          }
          const [a, b] = SINCRONIA[SINCRONIA.length - 1];
          return b + (t - a);
        };
        const figli = tl.getChildren(false, true, false).map((f) => ({
          f,
          inizio: f.startTime(),
          durata: f.totalDuration(),
          vars: f.vars,
          bersagli: f.targets(),
        }));
        for (const { f } of figli) f.kill();
        for (const { inizio, durata, vars, bersagli } of figli) {
          const nuovoInizio = T(inizio);
          const fattore = durata > 0 ? Math.max(0.01, T(inizio + durata) - nuovoInizio) / durata : 1;
          const nuovi = { ...vars, immediateRender: false };
          delete nuovi.parent;
          delete nuovi.delay;
          if (typeof vars.duration === "number") nuovi.duration = vars.duration * fattore;
          if (typeof vars.stagger === "number") nuovi.stagger = vars.stagger * fattore;
          if (typeof vars.repeatDelay === "number") nuovi.repeatDelay = vars.repeatDelay * fattore;
          tl.to(bersagli, nuovi, nuovoInizio);
        }
        tl.progress(1).progress(0);
      }
      // SINCRONIA-FINE
        // Le 12 stelle della bandiera europea, disegnate una volta (niente casualità).
        const stelle = document.getElementById("pot-cerchio-stelle");
        const punta = (r, a) => `${(r * Math.cos(a)).toFixed(2)},${(r * Math.sin(a)).toFixed(2)}`;
        for (let i = 0; i < 12; i++) {
          const a = (i * Math.PI) / 6;
          const cx = 88 * Math.cos(a);
          const cy = 88 * Math.sin(a);
          const punti = [];
          for (let k = 0; k < 10; k++) {
            const r = k % 2 === 0 ? 15 : 6;
            const b = -Math.PI / 2 + (k * Math.PI) / 5;
            punti.push(punta(r, b));
          }
          const stella = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
          stella.setAttribute("points", punti.join(" "));
          stella.setAttribute("transform", `translate(${cx.toFixed(2)} ${cy.toFixed(2)})`);
          stella.setAttribute("class", "pot-stella");
          stelle.appendChild(stella);
        }

        // Tempi locali: voce 08 a +0,8 s. «The timing is right.» apre la scena;
        // il resto è scritto sui tempi delle parole con D = 1,39 s di ritardo.
        const D = 1.39;
        const tl = gsap.timeline({ paused: true });
        const entra = { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: "back.out(1.4)" };
        const esce = { opacity: 0, y: -50, duration: 0.5, ease: "power2.in", stagger: 0.05 };
        const conta = (sel, da, a, t, durata, formato) => {
          const el = document.querySelector(sel);
          const stato = { v: da };
          tl.to(stato, { v: a, duration: durata, ease: "power2.out", onUpdate: () => { el.textContent = formato(stato.v); } }, t);
        };

        tl.fromTo("#pot-fondo", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "power1.out" }, 0);

        // «The timing is right.»
        tl.fromTo("#pot-o1", { opacity: 0, y: 20, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.8)" }, 0.9);
        // 1. «Since March 2026, every report in Italy must reach the electronic health record within five days.»
        tl.fromTo("#pot-s1", { opacity: 0, y: 60, scale: 0.94 }, entra, D + 1.2);
        // «The country invested 1.38 billion euros in it»
        tl.fromTo("#pot-s2", { opacity: 0, y: 60, scale: 0.94 }, entra, D + 7.3);
        conta("#pot-n2", 0, 1.38, D + 7.45, 1.4, (v) => "€" + v.toFixed(2) + "bn");
        // «yet only one in four patients opens it when a new report arrives.»
        tl.fromTo("#pot-s3", { opacity: 0, y: 60, scale: 0.94 }, entra, D + 10.6);
        conta("#pot-n3", 0, 27, D + 10.75, 1.2, (v) => Math.round(v) + "%");
        tl.fromTo("#pot-f1", { opacity: 0 }, { opacity: 1, duration: 0.5 }, D + 11.4);
        tl.to(["#pot-o1", "#pot-s1", "#pot-s2", "#pot-s3", "#pot-f1"], esce, D + 12.85);

        // 2. «We are entering a growing sector: Italian digital health, worth 2.7 billion euros a year.»
        tl.fromTo("#pot-o2", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, D + 13.35);
        tl.fromTo("#pot-mercato-titolo", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, D + 14.55);
        tl.fromTo("#pot-mercato-cifra", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(1.5)" }, D + 16.1);
        conta("#pot-mercato-valore", 0, 2.7, D + 16.1, 1.5, (v) => "€" + v.toFixed(1) + "bn");
        tl.fromTo("#pot-crescita", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, D + 18.85);
        tl.fromTo("#pot-f2", { opacity: 0 }, { opacity: 1, duration: 0.5 }, D + 18.9);
        tl.to(["#pot-o2", "#pot-mercato-titolo", "#pot-mercato-cifra", "#pot-crescita", "#pot-f2"], esce, D + 19.45);

        // 3. «Referto plugs into the portals that deliver reports: doctors' practices first,
        //     like Giovanna's, then labs, then every region's health record.»
        tl.fromTo("#pot-o3", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, D + 19.9);
        tl.fromTo("#pot-t1", { opacity: 0, y: 50, scale: 0.92 }, entra, D + 22.9);
        tl.fromTo("#pot-giovanna", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, D + 24.95);
        tl.fromTo("#pot-l1", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power2.inOut" }, D + 25.9);
        tl.fromTo("#pot-t2", { opacity: 0, y: 50, scale: 0.92 }, entra, D + 26.2);
        tl.fromTo("#pot-l2", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power2.inOut" }, D + 26.85);
        tl.fromTo("#pot-t3", { opacity: 0, y: 50, scale: 0.92 }, entra, D + 27.15);
        tl.to(["#pot-o3", "#pot-t1", "#pot-l1", "#pot-t2", "#pot-l2", "#pot-t3"], esce, D + 28.75);

        // 4. «And with the European Health Data Space, the same need reaches 450 million Europeans.»
        tl.fromTo("#pot-o4", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, D + 29.15);
        tl.fromTo("#pot-stelle", { opacity: 0, scale: 0.6, rotation: -30 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.9, ease: "back.out(1.4)" }, D + 29.6);
        tl.fromTo("#pot-f4", { opacity: 0 }, { opacity: 1, duration: 0.5 }, D + 30.4);
        tl.fromTo("#pot-europa-numero", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, D + 32.6);
        conta("#pot-europa-numero", 0, 450, D + 32.7, 1.5, (v) => Math.round(v) + "M");
        tl.fromTo("#pot-europa-sotto", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, D + 34.3);

        riallinea(tl);
        window.__timelines["scena-08-potenziale"] = tl;
      </script>
