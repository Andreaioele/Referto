      <script>
      // SINCRONIA-INIZIO (generato da voce/sincronizza.py: non modificare a mano)
      // Tempi della scena: [tempo sulla voce di riferimento, tempo sulla traccia].
      const SINCRONIA = [[0.0, 0.0], [1.103, 1.103], [2.646, 2.533], [3.098, 2.963], [4.614, 4.483], [5.345, 4.973], [7.247, 7.503], [9.258, 7.973], [11.718, 10.323], [12.582, 10.823], [15.269, 13.753], [17.183, 15.123], [19.763, 17.573], [20.734, 18.803]];
      // Ricrea ogni tween sui tempi della traccia (inizio spostato, durata adattata).
      // Non si cambiano startTime() e timeScale() dei tween esistenti: GSAP li
      // disegnerebbe subito e i fromTo con immediateRender: false applicherebbero i
      // valori di partenza fuori tempo. Alla fine la timeline va alla fine e torna
      // all'inizio: così ogni .to() registra la partenza giusta una volta per tutte e
      // l'anteprima o il render possono saltare in qualsiasi punto.
      function riallinea(tl) {
        const T = (t) => {
          if (t <= SINCRONIA[0][0]) return t - SINCRONIA[0][0] + SINCRONIA[0][1];
          for (let i = 1; i < SINCRONIA.length; i++) {
            if (t <= SINCRONIA[i][0]) {
              const [a0, b0] = SINCRONIA[i - 1];
              const [a1, b1] = SINCRONIA[i];
              return b0 + ((t - a0) * (b1 - b0)) / (a1 - a0);
            }
          }
          const [a, b] = SINCRONIA[SINCRONIA.length - 1];
          return b + (t - a);
        };
        const figli = tl.getChildren(false, true, false).map((f) => ({
          f,
          inizio: f.startTime(),
          durata: f.totalDuration(),
          vars: f.vars,
          bersagli: f.targets(),
        }));
        for (const { f } of figli) f.kill();
        for (const { inizio, durata, vars, bersagli } of figli) {
          const nuovoInizio = T(inizio);
          const fattore = durata > 0 ? Math.max(0.01, T(inizio + durata) - nuovoInizio) / durata : 1;
          const nuovi = { ...vars, immediateRender: false };
          delete nuovi.parent;
          delete nuovi.delay;
          if (typeof vars.duration === "number") nuovi.duration = vars.duration * fattore;
          if (typeof vars.stagger === "number") nuovi.stagger = vars.stagger * fattore;
          if (typeof vars.repeatDelay === "number") nuovi.repeatDelay = vars.repeatDelay * fattore;
          tl.to(bersagli, nuovi, nuovoInizio);
        }
        tl.progress(1).progress(0);
      }
      // SINCRONIA-FINE
        // Tempi locali: 0 = 97,8 s del video. Voce 06 a +1,0 s.
        const tl = gsap.timeline({ paused: true });

        // Le linee si «disegnano»: lunghezze calcolate dai percorsi (non dal layout).
        const traccia = (id, t, durata = 0.6) => {
          const linea = document.getElementById(id);
          const lunghezza = linea.getTotalLength();
          tl.fromTo(
            linea,
            { strokeDasharray: lunghezza, strokeDashoffset: lunghezza },
            { strokeDashoffset: 0, duration: durata, ease: "power2.inOut" },
            t,
          );
        };
        // Il pallino segue una spezzata a velocità costante e passa sotto i riquadri.
        const viaggio = (sel, punti, t, durata) => {
          const tratti = punti.slice(1).map((p, i) => Math.hypot(p[0] - punti[i][0], p[1] - punti[i][1]));
          const totale = tratti.reduce((a, b) => a + b, 0);
          const punto = (f) => {
            let resto = f * totale;
            for (let i = 0; i < tratti.length; i++) {
              if (resto <= tratti[i] || i === tratti.length - 1) {
                const k = tratti[i] ? Math.min(1, resto / tratti[i]) : 0;
                return [punti[i][0] + (punti[i + 1][0] - punti[i][0]) * k, punti[i][1] + (punti[i + 1][1] - punti[i][1]) * k];
              }
              resto -= tratti[i];
            }
            return punti[punti.length - 1];
          };
          const el = document.querySelector(sel);
          const stato = { f: 0 };
          tl.set(sel, { x: punti[0][0], y: punti[0][1] }, t);
          tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.15 }, t);
          tl.to(stato, {
            f: 1,
            duration: durata,
            ease: "power1.inOut",
            onUpdate: () => {
              const [x, y] = punto(stato.f);
              gsap.set(el, { x, y });
            },
          }, t);
          tl.to(sel, { opacity: 0, duration: 0.2 }, t + durata - 0.1);
        };
        const nodo = (sel, t) =>
          tl.fromTo(sel, { opacity: 0, y: 26, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "back.out(1.5)" }, t);

        tl.fromTo("#s6-fondo", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "power1.out" }, 0);
        tl.fromTo("#s6-titolo", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.9);

        // «Dietro le quinte, un agente legge il referto…»
        nodo("#s6-portale", 1.1);
        nodo("#s6-backend", 1.6);
        traccia("s6-l-ab", 1.8);
        nodo("#s6-agente", 2.6);
        traccia("s6-l-bc", 2.8, 0.4);
        tl.to("#s6-agente", { borderColor: "#8fd6bd", boxShadow: "0 0 0 8px rgba(143, 214, 189, 0.16)", duration: 0.4 }, 3.3);
        // Il referto attraversa il sistema fino all'agente.
        viaggio("#s6-imp-1", [[340, 440], [1040, 440]], 3.4, 1.1);

        // «…e consulta il prontuario dell'AIFA e il glossario medico.»
        traccia("s6-l-c1", 5.1, 0.5);
        nodo("#s6-prontuario", 5.35);
        traccia("s6-l-c2", 7.0, 0.4);
        nodo("#s6-glossario", 7.2);

        // «Le strutture sanitarie arrivano dai dati aperti, a partire dall'area del referto.»
        traccia("s6-l-b3", 9.2, 0.5);
        nodo("#s6-strutture", 9.45);
        tl.to("#s6-strutture", { borderColor: "#8fd6bd", duration: 0.4 }, 11.4);
        // L'area scritta dall'agente torna al backend, che cerca le strutture.
        viaggio("#s6-imp-2", [[1040, 440], [750, 440], [750, 600], [560, 600], [560, 724]], 12.5, 1.6);

        // «E il modello linguistico gira su infrastruttura AMD, con AMD Token Factory.»
        nodo("#s6-modello", 15.4);
        traccia("s6-l-cd", 15.6, 0.3);
        viaggio("#s6-imp-3", [[1420, 440], [1560, 440]], 15.8, 0.6);
        tl.fromTo("#s6-amd", { opacity: 0, scale: 1.12 }, { opacity: 1, scale: 1, duration: 0.7, ease: "power3.out" }, 17.0);
        tl.to("#s6-modello", { borderColor: "#e8e8e8", duration: 0.4 }, 17.2);
        tl.fromTo("#s6-amd-nome", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 17.95);

        // La camera si avvicina ad AMD: il diagramma resta tutto visibile. Lo zoom
        // finisce durante la pausa dopo «Token Factory», prima che entri la scena 7.
        tl.to("#s6-camera", { x: 960 - 1660 * 1.32, y: 540 - 440 * 1.32, scale: 1.32, duration: 2.2, ease: "power2.inOut" }, 18.6);

        riallinea(tl);
        window.__timelines["scena-06-tecnologia"] = tl;
      </script>
