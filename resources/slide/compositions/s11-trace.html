        grid-template-columns: 900px 1fr;
        gap: 80px;
      }
      #s11-trace {
        padding: 40px 44px;
        border-radius: 28px;

        color: #e5f3ed;

        display: flex;

        align-items: center;
        font-size: 30px;
        font-weight: 800;
      }
      #s11-testa span {
        padding: 6px 16px;
        border-radius: 999px;
        background: rgba(143, 214, 189, 0.16);
        color: #8fd6bd;
        font-size: 22px;
      }
      #s11-righe {
        margin-top: 26px;

        font-size: 28px;

    <div class="slide" id="s11">
      <p class="occhiello">Traces and privacy</p>
      <h2 class="titolo">Every run leaves a trace to measure it, <em>never the text of the report</em>.</h2>
      <div id="s11-scena">
        <div id="s11-trace">
          <div id="s11-testa">Trace · one explanation <span>example</span></div>
          <dl id="s11-righe">
            <dt>engine · model</dt><dd>direct · DeepSeek-V4.1-Flash</dd>
            <dt>duration</dt><dd>21.4 s</dd>
            <dt>first text</dt><dd>3.2 s</dd>
            <dt>tokens in → out</dt><dd>1,840 → 620</dd>
            <dt>tools</dt><dd>cercaFarmaci ✓ · cercaTermine ✓</dd>
            <dt>outcome</dt><dd>ok</dd>
          </dl>
          <div id="s11-privacy">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>

          <div class="s11-punto" id="s11-p1">
            <span class="icona"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg></span>

            <span class="icona"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"></path><path d="M21 3v5h-5"></path></svg></span>
            <div><p class="punto-titolo">Explained once</p><p class="punto-testo">Cached by a SHA-256 fingerprint of the report: the same report opens instantly.</p></div>
          </div>
          <div class="s11-punto" id="s11-p3">
            <span class="icona"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"></path></svg></span>

    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });
        const entra = (sel, t, da) => tl.fromTo(sel, { opacity: 0, ...da }, { opacity: 1, x: 0, y: 0, duration: 0.6, ease: "power3.out" }, t);
        entra("#s11 .titolo", 0.1, { y: 30 });
        entra("#s11-trace", 0.4, { y: 40 });
        entra("#s11-privacy", 1.0, { y: 10 });
        entra("#s11-p1", 0.6, { x: 40 });
        entra("#s11-p2", 0.8, { x: 40 });
        entra("#s11-p3", 1.0, { x: 40 });
        window.__timelines["s11-trace"] = tl;
      })();
    </script>
  </div>
